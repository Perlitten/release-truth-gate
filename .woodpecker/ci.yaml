labels:
  capability: linux
when:
- event: pull_request
- event: push
  branch: main
- event: manual
services:
- name: postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: release_truth
    POSTGRES_PASSWORD: release_truth_ci
    POSTGRES_DB: release_truth_test
steps:
- name: verify
  image: node:22.23.3-bookworm
  environment:
    CI: 'true'
    DATABASE_URL: postgresql://release_truth:release_truth_ci@postgres:5432/release_truth_test
    DATABASE_URL_TEST: postgresql://release_truth:release_truth_ci@postgres:5432/release_truth_test
    DATABASE_URL_DIRECT: postgresql://release_truth:release_truth_ci@postgres:5432/release_truth_test
  commands:
  - npm ci
  - node --input-type=module -e 'import pg from "pg"; for(let i=0;i<60;i++){ const
    c=new pg.Client({connectionString:process.env.DATABASE_URL}); try{await c.connect();await
    c.query("select 1");await c.end();process.exit(0)}catch(e){await c.end().catch(()=>{});await
    new Promise(r=>setTimeout(r,1000))}}process.exit(1)'
  - npx playwright install --with-deps chromium
  - npm run test
  - npm run test:db
  - npm run audit:prod
  - npm run build
  - npm run test:e2e
- name: collect-failure-artifacts
  image: node:22.23.3-bookworm
  commands:
  - mkdir -p test-results playwright-report
  - tar -czf ci-failure-artifacts.tar.gz test-results playwright-report
  when:
  - status: failure
- name: upload-failure-artifacts
  image: woodpeckerci/plugin-s3
  settings:
    bucket:
      from_secret: ci_artifact_bucket
    endpoint:
      from_secret: ci_artifact_endpoint
    access_key:
      from_secret: ci_artifact_access_key
    secret_key:
      from_secret: ci_artifact_secret_key
    source: ci-failure-artifacts.tar.gz
    target: /${CI_REPO}/${CI_PIPELINE_NUMBER}/ci
    path_style: true
    region: us-east-1
    access: private
  when:
  - status: failure
